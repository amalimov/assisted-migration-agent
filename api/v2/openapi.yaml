openapi: 3.0.3
info:
  title: Assisted Migration Agent API
  version: v2
servers:
  - url: /api/v2
tags:
  - name: Agent
    description: Local agent status
  - name: Collections
    description: Collection database management
  - name: Collector
    description: Inventory collection operations
  - name: Inventories
    description: Collected inventory resources
  - name: VirtualMachines
    description: Virtual machine queries across all vCenters
  - name: Groups
    description: VirtualMachine group management
  - name: Version
    description: Agent version information
paths:
  # ── Agent ──────────────────────────────────────────────────────────────
  /agent:
    get:
      tags: [Agent]
      summary: Get agent status
      operationId: getAgentStatus
      responses:
        '200':
          description: Agent status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentStatus'
        '500':
          description: Internal server error
  /virtualmachines:
    get:
      tags: [VirtualMachines]
      summary: List VirtualMachines from the latest collection
      operationId: listLatestVirtualMachines
      parameters:
        - name: byExpression
          in: query
          description: Filter by expression
          schema:
            type: string
        - name: sort
          in: query
          description: Sort fields with direction (e.g., "name:asc", "cluster:desc"). Valid fields are name, vCenterState, cluster, datacenter, diskSize, memory, issues.
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
          example: ["cluster:asc", "name:desc"]
        - name: page
          in: query
          description: Page number for pagination
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: pageSize
          in: query
          description: Number of items per page
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: List of VirtualMachines
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VirtualMachineListResponse'
        '400':
          description: Invalid request parameters
        '404':
          description: No collections found
        '500':
          description: Internal server error

  /virtualmachines/batch-update-exclusion:
    post:
      tags: [VirtualMachines]
      summary: Batch update migration exclusion for multiple VMs in the latest collection
      operationId: batchUpdateLatestVMExclusion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchUpdateExclusionRequest'
      responses:
        '200':
          description: Exclusion updated
        '400':
          description: Invalid request
        '404':
          description: No collections found
        '500':
          description: Internal server error

  /virtualmachines/filter-options:
    get:
      tags: [VirtualMachines]
      summary: Get available filter option values from the latest collection
      operationId: getLatestVMFilterOptions
      responses:
        '200':
          description: Filter options
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VMFilterOptionsResponse'
        '404':
          description: No collections found
        '500':
          description: Internal server error

  /virtualmachines/labels:
    get:
      tags: [VirtualMachines]
      summary: Get all distinct labels with counts from the latest collection
      operationId: getLatestVMLabels
      responses:
        '200':
          description: Labels with counts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VMLabelsResponse'
        '404':
          description: No collections found
        '500':
          description: Internal server error

  /virtualmachines/labels/{label}:
    patch:
      tags: [VirtualMachines]
      summary: Add or remove a label from multiple VMs in the latest collection
      operationId: updateLatestLabelVMs
      parameters:
        - name: label
          in: path
          required: true
          description: Label name
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateLabelVMsRequest'
      responses:
        '200':
          description: Label updated
        '400':
          description: Invalid request
        '404':
          description: No collections found
        '500':
          description: Internal server error
    delete:
      tags: [VirtualMachines]
      summary: Remove a label from all VMs in the latest collection
      operationId: deleteLatestLabelGlobally
      parameters:
        - name: label
          in: path
          required: true
          description: Label name
          schema:
            type: string
      responses:
        '200':
          description: Label removed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteLabelGloballyResponse'
        '400':
          description: Invalid request
        '500':
          description: Internal server error

  /virtualmachines/{vmId}:
    get:
      tags: [VirtualMachines]
      summary: Get VirtualMachine details from the latest collection
      operationId: getLatestVirtualMachine
      parameters:
        - name: vmId
          in: path
          required: true
          description: VirtualMachine ID
          schema:
            type: string
      responses:
        '200':
          description: VirtualMachine details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VirtualMachineDetail'
        '404':
          description: No collections or VirtualMachine not found
        '500':
          description: Internal server error
    patch:
      tags: [VirtualMachines]
      summary: Update VirtualMachine properties in the latest collection
      operationId: updateLatestVirtualMachine
      parameters:
        - name: vmId
          in: path
          required: true
          description: VirtualMachine ID
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VirtualMachineUpdateRequest'
      responses:
        '200':
          description: VirtualMachine updated
        '400':
          description: Invalid request
        '404':
          description: No collections or VirtualMachine not found
        '500':
          description: Internal server error

  /groups:
    get:
      tags: [Groups]
      summary: List groups from the latest collection
      operationId: listLatestGroups
      parameters:
        - name: byName
          in: query
          required: false
          description: Filter groups by name (case-insensitive substring match)
          schema:
            type: string
        - name: page
          in: query
          required: false
          description: Page number (1-indexed)
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          required: false
          description: Number of groups per page
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: List of groups
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupListResponse'
        '400':
          description: Invalid filter expression
        '404':
          description: No collections found
        '500':
          description: Internal server error
    post:
      tags: [Groups]
      summary: Create a new group in the latest collection
      operationId: createLatestGroup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGroupRequest'
      responses:
        '201':
          description: Group created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '400':
          description: Invalid request
        '404':
          description: No collections found
        '500':
          description: Internal server error

  /groups/{groupId}:
    get:
      tags: [Groups]
      summary: Get group by ID from the latest collection
      operationId: getLatestGroup
      parameters:
        - name: groupId
          in: path
          required: true
          description: Group ID
          schema:
            type: string
        - name: sort
          in: query
          description: Sort fields with direction (e.g., "name:asc", "cluster:desc"). Valid fields are name, vCenterState, cluster, datacenter, diskSize, memory, issues.
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
          example: ["cluster:asc", "name:desc"]
        - name: page
          in: query
          description: Page number for pagination
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: pageSize
          in: query
          description: Number of items per page
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Group details with VirtualMachines
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupResponse'
        '404':
          description: No collections or group not found
        '500':
          description: Internal server error
    patch:
      tags: [Groups]
      summary: Update group in the latest collection
      operationId: updateLatestGroup
      parameters:
        - name: groupId
          in: path
          required: true
          description: Group ID
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateGroupRequest'
      responses:
        '200':
          description: Group updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '400':
          description: Invalid request
        '404':
          description: No collections or group not found
        '500':
          description: Internal server error
    delete:
      tags: [Groups]
      summary: Delete group from the latest collection
      operationId: deleteLatestGroup
      parameters:
        - name: groupId
          in: path
          required: true
          description: Group ID
          schema:
            type: string
      responses:
        '204':
          description: Group deleted
        '404':
          description: No collections or group not found
        '500':
          description: Internal server error

  /inventory:
    get:
      tags: [Inventories]
      summary: Get inventory from the latest collection
      operationId: getLatestInventory
      parameters:
        - name: scope
          in: query
          required: false
          description: >-
            Selects which inventories to return. "main" (default) returns only the main
            inventory as JSON. "all" returns a ZIP bundle containing the main inventory
            (inventory.json) and every group subset inventory (subsets/<groupId>.json),
            for manual upload in disconnected environments.
          schema:
            type: string
            enum: [main, all]
            default: main
      responses:
        '200':
          description: >-
            Collected inventory. JSON when scope is "main"; a ZIP archive when scope is "all".
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Inventory'
            application/zip:
              schema:
                type: string
                format: binary
        '404':
          description: No collections or inventory not found
        '500':
          description: Internal server error

  # ── Collections ────────────────────────────────────────────────────────
  /collections:
    get:
      tags: [Collections]
      summary: List all collections
      operationId: listCollections
      responses:
        '200':
          description: List of collections
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionListResponse'
        '500':
          description: Internal server error
    delete:
      tags: [Collections]
      summary: Delete all collections
      operationId: deleteCollections
      responses:
        '204':
          description: Delete all collections
        '500':
          description: Internal server error

  # ── Collectors ─────────────────────────────────────────────────────────
  /collector:
    get:
      tags: [Collector]
      summary: Get collector status
      operationId: getCollectorStatus
      responses:
        '200':
          description: Collector status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectorStatus'
        '500':
          description: Internal server error
    delete:
      tags: [Collector]
      summary: Stop collector
      operationId: stopCollector
      responses:
        '204':
          description: Collector stopped
        '500':
          description: Internal server error

  /collector/rvtools:
    post:
      tags: [Collector]
      summary: Start a collection from RVTools files
      operationId: startRvtoolsCollector
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [files]
              properties:
                files:
                  type: array
                  items:
                    type: string
                    format: binary
      responses:
        '202':
          description: Collection started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectorStatus'
        '400':
          description: No files provided
        '409':
          description: Collection already in progress
        '500':
          description: Internal server error
        '501':
          description: RVTools mode is not enabled

  # ── Inventories ─────────────────────────────────────────────────────────
  /collections/{id}/inventory:
    get:
      tags: [Inventories]
      summary: Get collected inventory for a collection
      operationId: getInventory
      parameters:
        - name: id
          in: path
          required: true
          description: Collection ID
          schema:
            type: string
      responses:
        '200':
          description: Collected inventory
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Inventory'
        '404':
          description: Collection or inventory not found
        '500':
          description: Internal server error

  # ── Virtual Machines ───────────────────────────────────────────────────
  /collections/{id}/virtualmachines:
    get:
      tags: [VirtualMachines]
      summary: List VirtualMachines in a collection
      operationId: listVirtualMachines
      parameters:
        - name: id
          in: path
          required: true
          description: Collection ID
          schema:
            type: string
        - name: byExpression
          in: query
          description: Filter by expression
          schema:
            type: string
        - name: sort
          in: query
          description: Sort fields with direction (e.g., "name:asc", "cluster:desc"). Valid fields are name, vCenterState, cluster, datacenter, diskSize, memory, issues.
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
          example: ["cluster:asc", "name:desc"]
        - name: page
          in: query
          description: Page number for pagination
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: pageSize
          in: query
          description: Number of items per page
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: List of VirtualMachines
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VirtualMachineListResponse'
        '400':
          description: Invalid request parameters
        '404':
          description: Collection not found
        '500':
          description: Internal server error

  /collections/{id}/virtualmachines/filter-options:
    get:
      tags: [VirtualMachines]
      summary: Get available filter option values
      operationId: getVMFilterOptions
      parameters:
        - name: id
          in: path
          required: true
          description: Collection ID
          schema:
            type: string
      responses:
        '200':
          description: Filter options
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VMFilterOptionsResponse'
        '404':
          description: Collection not found
        '500':
          description: Internal server error

  /collections/{id}/virtualmachines/labels:
    get:
      tags: [VirtualMachines]
      summary: Get all distinct labels with counts
      operationId: getVMLabels
      parameters:
        - name: id
          in: path
          required: true
          description: Collection ID
          schema:
            type: string
      responses:
        '200':
          description: Labels with counts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VMLabelsResponse'
        '404':
          description: Collection not found
        '500':
          description: Internal server error

  /collections/{id}/virtualmachines/{vmId}:
    get:
      tags: [VirtualMachines]
      summary: Get VirtualMachine details
      operationId: getVirtualMachine
      parameters:
        - name: id
          in: path
          required: true
          description: Collection ID
          schema:
            type: string
        - name: vmId
          in: path
          required: true
          description: VirtualMachine ID
          schema:
            type: string
      responses:
        '200':
          description: VirtualMachine details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VirtualMachineDetail'
        '404':
          description: Collection or VirtualMachine not found
        '500':
          description: Internal server error

  /collections/{id}/export:
    get:
      tags: [Collections]
      summary: Export collection data as CSV ZIP archive or Excel workbook
      operationId: exportCollection
      parameters:
        - name: id
          in: path
          required: true
          description: Collection ID
          schema:
            type: string
        - name: scope
          in: query
          required: false
          description: Comma-separated export scopes (e.g., "overview,vms,groups"). Defaults to "overview".
          schema:
            type: string
        - name: format
          in: query
          required: false
          description: "Output format: zip (CSV files in a ZIP archive) or xlsx (Excel workbook with one sheet per scope)"
          schema:
            type: string
            enum: [zip, xlsx]
            default: zip
      responses:
        '200':
          description: ZIP archive containing CSV files or Excel workbook
          content:
            application/zip:
              schema:
                type: string
                format: binary
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        '400':
          description: Invalid scope
        '404':
          description: Collection not found
        '500':
          description: Internal server error

  /collections/{id}/groups:
    get:
      tags: [Groups]
      summary: List all groups in a collection
      operationId: listGroups
      parameters:
        - name: id
          in: path
          required: true
          description: Collection ID
          schema:
            type: string
        - name: byName
          in: query
          required: false
          description: Filter groups by name (case-insensitive substring match)
          schema:
            type: string
        - name: page
          in: query
          required: false
          description: Page number (1-indexed)
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          required: false
          description: Number of groups per page
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: List of groups
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupListResponse'
        '400':
          description: Invalid filter expression
        '404':
          description: Collection not found
        '500':
          description: Internal server error

  /collections/{id}/groups/{groupId}:
    get:
      tags: [Groups]
      summary: Get group by ID with its VirtualMachines
      operationId: getGroup
      parameters:
        - name: id
          in: path
          required: true
          description: Collection ID
          schema:
            type: string
        - name: groupId
          in: path
          required: true
          description: Group ID
          schema:
            type: string
        - name: sort
          in: query
          description: Sort fields with direction (e.g., "name:asc", "cluster:desc"). Valid fields are name, vCenterState, cluster, datacenter, diskSize, memory, issues.
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
          example: ["cluster:asc", "name:desc"]
        - name: page
          in: query
          description: Page number for pagination
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: pageSize
          in: query
          description: Number of items per page
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Group details with VirtualMachines
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupResponse'
        '404':
          description: Collection or group not found
        '500':
          description: Internal server error

  /collections/compare/{aId}/{bId}:
    get:
      tags: [Collections]
      summary: Compare two collections — returns aggregates and diffs
      operationId: compareCollections
      parameters:
        - name: aId
          in: path
          required: true
          description: Baseline collection ID
          schema:
            type: string
        - name: bId
          in: path
          required: true
          description: Comparison target collection ID
          schema:
            type: string
      responses:
        '200':
          description: Comparison summary with per-collection aggregates and diffs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionComparisonSummary'
        '404':
          description: Either collection not found
        '500':
          description: Internal server error

  /collections/compare/{aId}/{bId}/{dimension}:
    get:
      tags: [Collections]
      summary: Drill down — VM IDs that differ between two collections for a given dimension
      operationId: compareCollectionsDiff
      parameters:
        - name: aId
          in: path
          required: true
          description: Baseline collection ID
          schema:
            type: string
        - name: bId
          in: path
          required: true
          description: Comparison target collection ID
          schema:
            type: string
        - name: dimension
          in: path
          required: true
          description: The metric to compare
          schema:
            type: string
            enum:
              - total
              - migratable
              - non-migratable
        - name: page
          in: query
          description: Page number (1-based). Applied independently to onlyInA and onlyInB.
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: pageSize
          in: query
          description: Number of VM IDs per page per side
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Paginated VM IDs that differ between the two collections for the given dimension
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionComparisonDiff'
        '400':
          description: Invalid dimension value
        '404':
          description: Either collection not found
        '500':
          description: Internal server error

  /version:
    get:
      tags: [Version]
      summary: Get agent version information
      operationId: getVersion
      responses:
        '200':
          description: Version information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionInfo'

# ══════════════════════════════════════════════════════════════════════════
components:
  schemas:
    # ── Collections ──────────────────────────────────────────────────────
    Collection:
      type: object
      required:
        - id
        - name
        - createdAt
      properties:
        id:
          type: string
          description: Collection identifier
        name:
          type: string
          description: Collection name
        createdAt:
          type: string
          format: date-time
          description: When the collection was created

    CollectionListResponse:
      type: object
      required:
        - collections
      properties:
        collections:
          type: array
          items:
            $ref: '#/components/schemas/Collection'

    CollectionAggregate:
      type: object
      required:
        - id
        - createdAt
        - totalVMs
        - migratable
        - nonMigratable
        - clusters
      properties:
        id:
          type: string
          description: Collection identifier
        createdAt:
          type: string
          format: date-time
          description: When the collection was created
        totalVMs:
          type: integer
          description: Total number of VMs in the collection
        migratable:
          type: integer
          description: Number of migratable VMs (no Critical concerns)
        nonMigratable:
          type: integer
          description: Number of non-migratable VMs (at least one Critical concern)
        clusters:
          type: integer
          description: Number of distinct clusters

    ComparisonDiffEntry:
      type: object
      required:
        - delta
      properties:
        delta:
          type: integer
          description: Difference (B minus A). Positive means B has more.
        onlyInA:
          type: integer
          description: Count of VMs satisfying this dimension in A but not in B
        onlyInB:
          type: integer
          description: Count of VMs satisfying this dimension in B but not in A

    ComparisonDiffPage:
      type: object
      required:
        - total
        - page
        - pageCount
        - vmIds
      properties:
        total:
          type: integer
          description: Total number of VM IDs in this list
        page:
          type: integer
          description: Current page number
        pageCount:
          type: integer
          description: Total number of pages
        vmIds:
          type: array
          items:
            type: string
          description: VM IDs on this page. Empty array when page exceeds pageCount.

    CollectionComparisonSummary:
      type: object
      required:
        - collections
        - diff
      properties:
        collections:
          type: array
          minItems: 2
          maxItems: 2
          items:
            $ref: '#/components/schemas/CollectionAggregate'
          description: Aggregates for both collections. Index 0 is A (baseline), index 1 is B.
        diff:
          type: object
          required:
            - totalVMs
            - migratable
            - nonMigratable
            - clusters
          properties:
            totalVMs:
              $ref: '#/components/schemas/ComparisonDiffEntry'
            migratable:
              $ref: '#/components/schemas/ComparisonDiffEntry'
            nonMigratable:
              $ref: '#/components/schemas/ComparisonDiffEntry'
            clusters:
              $ref: '#/components/schemas/ComparisonDiffEntry'
          description: Numeric differences (B minus A) with symmetric set-diff counts per dimension. clusters has no onlyInA/onlyInB.

    CollectionComparisonDiff:
      type: object
      required:
        - dimension
        - onlyInA
        - onlyInB
      properties:
        dimension:
          type: string
          enum:
            - total
            - migratable
            - non-migratable
          description: The dimension being compared
        onlyInA:
          $ref: '#/components/schemas/ComparisonDiffPage'
          description: VM IDs satisfying the dimension in A but not in B
        onlyInB:
          $ref: '#/components/schemas/ComparisonDiffPage'
          description: VM IDs satisfying the dimension in B but not in A

    # ── Collectors ───────────────────────────────────────────────────────
    CollectorStatus:
