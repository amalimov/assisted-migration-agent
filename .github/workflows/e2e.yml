name: RVTools e2e tests

on:
  workflow_dispatch:
  push:
    branches: [main, stable]
  pull_request:
    branches: [main, stable]

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install DuckDB Excel extension for offline test
        run: |
          curl -fsSL https://extensions.duckdb.org/v1.4.3/linux_amd64/excel.duckdb_extension.gz -o /tmp/excel.duckdb_extension.gz
          gunzip /tmp/excel.duckdb_extension.gz
          echo '3a5387ebbb0b8e84fea6eae635bad5f7c9832663d6e44f8a2faf9a315092aee2  /tmp/excel.duckdb_extension' | sha256sum -c -
          echo 'DUCKDB_EXCEL_EXTENSION=/tmp/excel.duckdb_extension' >> "$GITHUB_ENV"
      - name: Run RVTools API tests
        run: make e2e
